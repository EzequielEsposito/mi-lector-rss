<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mi lector RSS</title>
<style>
:root{--a:#27979d;--bg:#f4f7f7;--ink:#243238;--muted:#718087;--line:#e1e8e9}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif}.app{max-width:1100px;margin:auto;padding:28px 18px}.head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.head h1{font-size:25px;margin:0}.head p{margin:0;color:var(--muted);font-size:12px}.actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}button,input,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:white;border-radius:9px;padding:9px 12px;color:#43545a}button.primary{background:var(--a);border-color:var(--a);color:white}.bar{display:flex;gap:8px;margin:22px 0 12px;flex-wrap:wrap}.bar input{flex:1;min-width:180px}input,select{border:1px solid var(--line);border-radius:9px;padding:10px;background:white}.layout{display:grid;grid-template-columns:220px 1fr;gap:18px}.side,.article{background:white;border:1px solid var(--line);border-radius:12px}.side{padding:15px;height:max-content}.side h3{font-size:12px;color:var(--muted);text-transform:uppercase;margin:4px 0 10px}.side button{display:block;width:100%;text-align:left;margin:3px 0;border:0}.side button.active{background:#e8f5f5;color:#167b81}.list{display:grid;gap:9px}.article{padding:16px}.meta{font-size:11px;color:var(--muted)}.article h2{font-size:16px;margin:5px 0}.article p{font-size:13px;color:#5f6f75;margin:5px 0}.article a{color:#20868b;text-decoration:none;font-weight:650;font-size:12px}.tools{float:right;display:flex;gap:5px}.tools button{padding:4px 8px}.empty{padding:50px;text-align:center;color:var(--muted);border:1px dashed #bdcdcf;border-radius:12px}dialog{border:0;border-radius:14px;padding:22px;width:min(480px,calc(100% - 24px));box-shadow:0 20px 70px #0003}dialog::backdrop{background:#10232988}form label{display:block;font-size:12px;font-weight:700;margin:12px 0 5px}form input,form select{width:100%}.status{font-size:12px;color:var(--muted);min-height:18px}@media(max-width:700px){.layout{grid-template-columns:1fr}.side{display:flex;gap:6px;overflow:auto}.side h3{display:none}.side button{white-space:nowrap;width:auto}.actions{margin-left:0}}
</style></head><body><div class="app"><header class="head"><div><h1>◔ Mi lector RSS</h1><p>Tus fuentes y artículos, en un solo lugar</p></div><div class="actions"><button id="refresh">↻ Actualizar</button><button id="add" class="primary">＋ Agregar fuente</button><button id="opmlOut">Exportar OPML</button><button id="opmlIn">Importar OPML</button><input id="opmlFile" type="file" accept=".opml,.xml" hidden></div></header>
<div class="bar"><input id="search" placeholder="Buscar artículos o fuentes…"><select id="filter"><option value="all">Todos</option><option value="unread">No leídos</option><option value="read">Leídos</option><option value="starred">Favoritos</option></select><select id="sort"><option value="new">Más recientes</option><option value="old">Más antiguos</option></select></div><p class="status" id="status">Los datos se guardan en este navegador.</p>
<div class="layout"><aside class="side"><h3>Vistas</h3><button data-view="all" class="active">Todos los artículos</button><button data-view="unread">No leídos</button><button data-view="starred">Favoritos</button><h3 style="margin-top:18px">Categorías</h3><div id="cats"></div><button id="addCat">＋ Nueva categoría</button><h3 style="margin-top:18px">Fuentes</h3><div id="sources"></div></aside><main id="articles" class="list"><div class="empty">Agregá tu primera fuente RSS o Atom para empezar.</div></main></div></div>
<dialog id="feedDlg"><form id="feedForm"><h2>Agregar fuente</h2><label>URL del feed RSS/Atom</label><input id="feedUrl" type="url" required placeholder="https://sitio.com/feed.xml"><label>Categoría</label><select id="feedCat"><option value="">Sin categoría</option></select><p class="status">Ingresá la URL directa del feed, no necesariamente la página principal.</p><button type="button" id="cancel">Cancelar</button> <button class="primary">Verificar y agregar</button></form></dialog>
<script src="./config.js"></script><script>
const DB='mi-lector-rss-v1';let db,feeds=[],articles=[],cats=[],view='all',selectedFeed='',selectedCat='';
const $=s=>document.querySelector(s),uid=()=>crypto.randomUUID();
function req(r){return new Promise((ok,no)=>{r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
async function init(){db=await new Promise((ok,no)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=()=>{for(let s of ['feeds','articles','cats'])r.result.createObjectStore(s,{keyPath:'id'})};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});await load();if(feeds.length)refreshAll()}
function all(s){return req(db.transaction(s).objectStore(s).getAll())}
async function put(s,x){return req(db.transaction(s,'readwrite').objectStore(s).put(x))}
async function load(){[feeds,articles,cats]=await Promise.all(['feeds','articles','cats'].map(all));render()}
function clean(s){let d=new DOMParser().parseFromString(s||'','text/html');return(d.body.textContent||'').replace(/\s+/g,' ').trim()}
function local(n,p){return [...p.getElementsByTagName('*')].find(x=>x.localName===n)?.textContent?.trim()||''}
function parse(xml,url){let d=new DOMParser().parseFromString(xml,'application/xml');if(d.querySelector('parsererror'))throw Error('El feed no devolvió XML válido.');let atom=d.documentElement.localName==='feed',root=atom?d.documentElement:(d.querySelector('channel')||d.documentElement),nodes=atom?[...root.children].filter(x=>x.localName==='entry'):[...d.getElementsByTagName('item')];return{title:local('title',root)||new URL(url).hostname,items:nodes.map((n,i)=>{let l=[...n.getElementsByTagName('*')].find(x=>x.localName==='link');let link=atom?(l?.getAttribute('href')||''):(l?.textContent||'').trim();try{link=new URL(link,url).href}catch{}let id=local('guid',n)||local('id',n)||link||String(i);return{id,title:local('title',n)||'Sin título',summary:clean(local('encoded',n)||local('content',n)||local('description',n)||local('summary',n)),link,date:local('pubDate',n)||local('published',n)||local('updated',n)}})}}
async function getFeed(url){let base=(window.RSS_API_BASE||'').replace(/\/$/,'');if(!base||base.includes('REEMPLAZAR'))throw Error('Primero configurá la URL del proxy en config.js.');let r=await fetch(base+'/feed?url='+encodeURIComponent(url));if(!r.ok){let j=await r.json().catch(()=>({}));throw Error(j.error||'No se pudo consultar el feed.')}return parse(await r.text(),url)}
async function addFeed(url,cat=''){let d=await getFeed(url),f={id:uid(),url,title:d.title,cat};await put('feeds',f);for(let x of d.items)await put('articles',{...x,id:f.id+'|'+x.id,feed:f.id,read:false,star:false});await load();return d.items.length}
async function refreshOne(f){let d=await getFeed(f.url);for(let x of d.items){let id=f.id+'|'+x.id,old=articles.find(a=>a.id===id);await put('articles',{...x,id,feed:f.id,read:old?.read||false,star:old?.star||false})}}
async function refreshAll(){if(!feeds.length)return;$('#refresh').disabled=true;$('#status').textContent='Actualizando fuentes…';let ok=0;for(let f of feeds){try{await refreshOne(f);ok++}catch(e){console.warn(e)}}await load();$('#refresh').disabled=false;$('#status').textContent='Fuentes actualizadas: '+ok+' de '+feeds.length+'.'}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){let q=$('#search').value.toLowerCase(),filt=$('#filter').value,sort=$('#sort').value;$('#cats').innerHTML=cats.map(c=>'<button data-cat="'+c.id+'">'+esc(c.name)+'</button>').join('');$('#sources').innerHTML=feeds.map(f=>'<button data-feed="'+f.id+'">'+esc(f.title)+'</button>').join('');$('#feedCat').innerHTML='<option value="">Sin categoría</option>'+cats.map(c=>'<option value="'+c.id+'">'+esc(c.name)+'</option>').join('');let list=articles.filter(a=>(view==='all'||(view==='unread'&&!a.read)||(view==='starred'&&a.star)||(view==='feed'&&a.feed===selectedFeed)||(view==='cat'&&feeds.find(f=>f.id===a.feed)?.cat===selectedCat))&&(filt==='all'||(filt==='read'&&a.read)||(filt==='unread'&&!a.read)||(filt==='starred'&&a.star))&&(!q||(a.title+' '+a.summary+' '+(feeds.find(f=>f.id===a.feed)?.title||'')).toLowerCase().includes(q)));list.sort((a,b)=>(new Date(a.date||0)-new Date(b.date||0))*(sort==='new'?-1:1));$('#articles').innerHTML=list.length?list.map(a=>'<article class="article"><div class="tools"><button data-star="'+esc(a.id)+'">'+(a.star?'★':'☆')+'</button><button data-read="'+esc(a.id)+'">'+(a.read?'Marcar no leído':'Marcar leído')+'</button></div><div class="meta">'+esc(feeds.find(f=>f.id===a.feed)?.title||'Fuente')+' · '+esc(a.date||'')+'</div><h2>'+esc(a.title)+'</h2><p>'+esc(a.summary)+'</p>'+(a.link?'<a href="'+esc(a.link)+'" target="_blank" rel="noopener">Leer artículo original ↗</a>':'')+'</article>').join(''):'<div class="empty">No hay artículos para mostrar.</div>';document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view))}
$('#add').onclick=()=>$('#feedDlg').showModal();$('#cancel').onclick=()=>$('#feedDlg').close();$('#feedForm').onsubmit=async e=>{e.preventDefault();try{let n=await addFeed($('#feedUrl').value.trim(),$('#feedCat').value);$('#feedDlg').close();$('#feedUrl').value='';$('#status').textContent='Fuente agregada: '+n+' artículos.'}catch(x){$('#status').textContent=x.message}};
$('#refresh').onclick=refreshAll;$('#search').oninput=render;$('#filter').onchange=render;$('#sort').onchange=render;
document.addEventListener('click',async e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.view){view=b.dataset.view;selectedFeed=selectedCat='';render()}if(b.dataset.feed){view='feed';selectedFeed=b.dataset.feed;render()}if(b.dataset.cat){view='cat';selectedCat=b.dataset.cat;render()}if(b.dataset.star||b.dataset.read){let a=articles.find(x=>x.id===(b.dataset.star||b.dataset.read));if(a){if(b.dataset.star)a.star=!a.star;else a.read=!a.read;await put('articles',a);await load()}}});
$('#addCat').onclick=async()=>{let name=prompt('Nombre de la categoría');if(name?.trim()){await put('cats',{id:uid(),name:name.trim()});await load()}};
$('#opmlOut').onclick=()=>{let x='<?xml version="1.0"?><opml version="2.0"><head><title>Mis fuentes</title></head><body>'+feeds.map(f=>'<outline text="'+esc(f.title)+'" type="rss" xmlUrl="'+esc(f.url)+'"/>').join('')+'</body></opml>',a=document.createElement('a');a.href=URL.createObjectURL(new Blob([x],{type:'text/xml'}));a.download='mis-fuentes.opml';a.click()};
$('#opmlIn').onclick=()=>$('#opmlFile').click();$('#opmlFile').onchange=async e=>{let file=e.target.files[0];if(!file)return;let d=new DOMParser().parseFromString(await file.text(),'text/xml');for(let n of d.querySelectorAll('outline[xmlUrl],outline[xmlurl]')){let u=n.getAttribute('xmlUrl')||n.getAttribute('xmlurl');if(!feeds.some(f=>f.url===u))try{await addFeed(u)}catch(err){console.warn(err)}}e.target.value=''};
init().catch(e=>$('#status').textContent='No se pudo iniciar: '+e.message);
</script></body></html>
